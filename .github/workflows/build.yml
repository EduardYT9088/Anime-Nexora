# Animes Nexora Plus — compila el APK automáticamente a partir de index.html
# Ruta en el repo: .github/workflows/build.yml
name: Compilar APK

on:
  push:
    branches: [main, master]
    paths: ['index.html', '.github/workflows/build.yml']
  workflow_dispatch:
  schedule:
    - cron: '*/14 * * * *'   # despierta tu servidor cada 14 min (no compila el APK)

permissions:
  contents: write

env:
  APP_NAME: "Animes Nexora Plus"
  APP_VERSION: "1.0.3"   # <- cambia aquí la versión del APK
  # Comentarios (Supabase): pega aquí la "Project URL" y la clave pública ("anon" o "publishable")
  NX_SB_URL: "https://lvnuolgcqttvlkvgagde.supabase.co"
  NX_SB_KEY: "sb_publishable_vvj-N9C2rbS-_rXPtxOHtg_iRBDuPaq"
  APP_ID: "com.nexora.animesplus"
  # Pega aquí la dirección de tu servidor en Render (déjalo vacío si no usas servidor)
  SERVER_URL: ""

jobs:
  despertar:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Mantener el servidor despierto
        run: |
          if [ -z "$SERVER_URL" ]; then echo "Sin SERVER_URL, nada que hacer"; exit 0; fi
          curl -s -o /dev/null -w "Servidor respondió %{http_code}\n" --max-time 90 "${SERVER_URL%/}/health" || true

  apk:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Probar servidor de comentarios
        if: env.NX_SB_URL != ''
        continue-on-error: true
        run: |
          code=$(curl -s -o sb.json -w "%{http_code}" "${NX_SB_URL}/rest/v1/comments?select=id&limit=1" -H "apikey: ${NX_SB_KEY}")
          echo "Comentarios: HTTP $code"; head -c 400 sb.json; echo
          [ "$code" = "200" ] && echo "OK: la tabla de comentarios responde" || echo "::warning::El servidor de comentarios respondió $code (¿corriste el SQL?)"
      - name: Crear proyecto Capacitor
        run: |
          mkdir -p _build/www
          cp index.html _build/www/index.html
          # la versión de la app sale de APP_VERSION (se usa para avisar actualizaciones)
          sed -i "s/__APP_VERSION__/${APP_VERSION}/g" _build/www/index.html
          sed -i "s|__SB_URL__|${NX_SB_URL}|g; s|__SB_KEY__|${NX_SB_KEY}|g" _build/www/index.html
          cd _build
          npm init -y > /dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 \
                @capacitor/app@6 @capacitor/screen-orientation@6 @capacitor/status-bar@6 \
                @capacitor/local-notifications@6 \
                @capacitor/filesystem@6 @capawesome-team/capacitor-file-opener@6 \
                hls.js@1.5.17 qrcode@1.5.4
          cp node_modules/hls.js/dist/hls.min.js www/hls.min.js
          # Código QR de donación (PayPal) dentro de Ajustes
          cat > qr.js <<'EOF'
          const Q=require('qrcode'),fs=require('fs');
          Q.toString('https://www.paypal.me/EdwardAlvarado285',{type:'svg',margin:1,errorCorrectionLevel:'M',color:{dark:'#0b0a1a',light:'#ffffff'}}).then(svg=>{
            const f='www/index.html';const h=fs.readFileSync(f,'utf8');
            if(!h.includes('<!--NX_QR-->'))throw new Error('falta el marcador del QR');
            fs.writeFileSync(f,h.replace('<!--NX_QR-->',svg.replace(/<\?xml[^>]*>/,'').trim()));console.log('QR de donación listo');
          }).catch(e=>{console.error(e);process.exit(1)});
          EOF
          node qr.js
          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "www",
            "backgroundColor": "#070611",
            "server": { "androidScheme": "http", "cleartext": true },
            "android": { "allowMixedContent": true },
            "plugins": {
              "CapacitorHttp": { "enabled": false },
              "LocalNotifications": { "smallIcon": "ic_stat_nexora", "iconColor": "#8B6BFF" }
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Personalizar Android (icono, splash, permisos, versión)
        run: |
          cd _build/android/app/src/main
          RES=res
          # Pantalla completa: usa la zona de la cámara perforada y oculta las barras al ver un episodio
          JDIR=java/$(echo "$APP_ID" | tr . /)
          mkdir -p $JDIR
          cat > $JDIR/MainActivity.java <<EOF
          package ${APP_ID};

          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(NexoraScreen.class);
                  super.onCreate(savedInstanceState);
                  NexoraCheck.schedule(this);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }
              }
          }
          EOF
          cat > $JDIR/NexoraScreen.java <<EOF
          package ${APP_ID};

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.UiModeManager;
          import android.content.ComponentName;
          import android.content.SharedPreferences;
          import androidx.core.app.NotificationManagerCompat;
          import com.getcapacitor.JSArray;
          import org.json.JSONArray;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.content.res.Configuration;
          import android.view.Window;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.Iterator;
          import android.graphics.Bitmap;
          import android.os.Handler;
          import android.os.Looper;
          import android.webkit.CookieManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import org.json.JSONArray;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "NexoraScreen")
          public class NexoraScreen extends Plugin {
              @Override
              public void load() {
                  NexoraCheck.schedule(getContext());
                  try { fromNotification(getActivity().getIntent()); } catch (Exception e) { }
              }

              @Override
              protected void handleOnNewIntent(Intent intent) {
                  super.handleOnNewIntent(intent);
                  fromNotification(intent);
              }

              /* Al tocar una notificación: abre el anime o la campana dentro de la app */
              private void fromNotification(Intent i) {
                  if (i == null) return;
                  String u = i.getStringExtra("nx_url");
                  boolean inbox = i.getBooleanExtra("nx_inbox", false);
                  if (u == null && !inbox) return;
                  JSObject d = new JSObject();
                  if (u != null) { d.put("url", u); d.put("ep", i.getIntExtra("nx_ep", 0)); }
                  d.put("inbox", inbox);
                  i.removeExtra("nx_url"); i.removeExtra("nx_inbox");
                  notifyListeners("nxOpen", d, true);
              }

              /* Datos para el revisor nativo: Mi lista, ajustes y episodios ya vistos */
              @PluginMethod
              public void syncCheck(PluginCall call) {
                  try {
                      SharedPreferences sp = getContext().getSharedPreferences(NexoraCheck.PREFS, 0);
                      SharedPreferences.Editor ed = sp.edit();
                      ed.putBoolean("on", Boolean.TRUE.equals(call.getBoolean("on", true)));
                      ed.putBoolean("all", Boolean.TRUE.equals(call.getBoolean("all", true)));
                      JSArray favs = call.getArray("favs", null);
                      if (favs != null) {
                          JSONArray old = new JSONArray(sp.getString("favs", "[]"));
                          for (int i = 0; i < favs.length(); i++) {
                              org.json.JSONObject f = favs.getJSONObject(i);
                              for (int j = 0; j < old.length(); j++) {
                                  org.json.JSONObject o = old.getJSONObject(j);
                                  if (o.optString("url").equals(f.optString("url")) && o.optInt("last", 0) > f.optInt("last", 0)) f.put("last", o.optInt("last"));
                              }
                          }
                          ed.putString("favs", favs.toString());
                      }
                      JSArray seen = call.getArray("seen", null);
                      if (seen != null && seen.length() > 0) {
                          java.util.LinkedHashSet<String> m = new java.util.LinkedHashSet<>();
                          JSONArray old = new JSONArray(sp.getString("seen", "[]"));
                          for (int i = 0; i < seen.length(); i++) m.add(seen.getString(i));
                          for (int i = 0; i < old.length() && m.size() < 300; i++) m.add(old.getString(i));
                          ed.putString("seen", new JSONArray(new java.util.ArrayList<>(m)).toString());
                      }
                      ed.apply();
                      NexoraCheck.schedule(getContext());
                  } catch (Exception e) { }
                  call.resolve();
              }

              /* Publica en la barra de estado los episodios que encontró la app abierta */
              @PluginMethod
              public void postEpisodes(PluginCall call) {
                  final JSArray items = call.getArray("items", new JSArray());
                  final Context c = getContext();
                  new Thread(() -> {
                      try { NexoraCheck.post(c, new JSONArray(items.toString()), true); } catch (Exception e) { }
                  }).start();
                  call.resolve();
              }

              /* Lo que encontró el revisor con la app cerrada, para la campana */
              @PluginMethod
              public void takeInbox(PluginCall call) {
                  JSObject r = new JSObject();
                  try {
                      SharedPreferences sp = getContext().getSharedPreferences(NexoraCheck.PREFS, 0);
                      r.put("items", new JSArray(sp.getString("inbox", "[]")));
                      sp.edit().putString("inbox", "[]").apply();
                  } catch (Exception e) { r.put("items", new JSArray()); }
                  call.resolve(r);
              }

              @PluginMethod
              public void notifState(PluginCall call) {
                  boolean on = false;
                  try {
                      on = NotificationManagerCompat.from(getContext()).areNotificationsEnabled();
                      NotificationManager nm = getContext().getSystemService(NotificationManager.class);
                      NotificationChannel ch = nm == null ? null : nm.getNotificationChannel(NexoraCheck.CH);
                      if (ch != null && ch.getImportance() == NotificationManager.IMPORTANCE_NONE) on = false;
                  } catch (Exception e) { }
                  JSObject r = new JSObject(); r.put("enabled", on); call.resolve(r);
              }

              @PluginMethod
              public void openNotifSettings(PluginCall call) {
                  Intent i = new Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS);
                  i.putExtra(Settings.EXTRA_APP_PACKAGE, getContext().getPackageName());
                  boolean ok = launch(i);
                  if (!ok) ok = appDetails();
                  done(call, ok);
              }

              /* POST de formulario hecho por Android (la fuente de Latino no acepta el formato del plugin web) */
              @PluginMethod
              public void httpPost(PluginCall call) {
                  final String url = call.getString("url");
                  final String body = call.getString("body", "");
                  final JSObject hdr = call.getObject("headers", new JSObject());
                  new Thread(() -> {
                      try {
                          HttpURLConnection h = (HttpURLConnection) new URL(url).openConnection();
                          h.setRequestMethod("POST"); h.setDoOutput(true); h.setConnectTimeout(15000); h.setReadTimeout(25000);
                          Iterator<String> it = hdr.keys();
                          while (it.hasNext()) { String k = it.next(); h.setRequestProperty(k, hdr.getString(k)); }
                          byte[] b = body.getBytes("UTF-8"); h.setFixedLengthStreamingMode(b.length);
                          try (OutputStream o = h.getOutputStream()) { o.write(b); }
                          int code = h.getResponseCode();
                          InputStream in = code >= 400 ? h.getErrorStream() : h.getInputStream();
                          String txt = "";
                          if (in != null) { ByteArrayOutputStream bo = new ByteArrayOutputStream(); byte[] buf = new byte[8192]; int n; while ((n = in.read(buf)) > 0) bo.write(buf, 0, n); txt = bo.toString("UTF-8"); in.close(); }
                          JSObject r = new JSObject(); r.put("status", code); r.put("data", txt); call.resolve(r);
                      } catch (Exception e) { call.reject(String.valueOf(e.getMessage())); }
                  }).start();
              }

              private int px(int dp) { return (int) (dp * getContext().getResources().getDisplayMetrics().density + 0.5f); }

              /* Abre una página en un navegador dentro de la app (detrás de la pantalla). Si Cloudflare pide verificación
                 por más de unos segundos, se muestra para que el usuario toque la casilla. Opcional: ejecuta "js" ya en la página. */
              @PluginMethod
              public void webGet(PluginCall call) {
                  final String url = call.getString("url");
                  final int tmo = call.getInt("timeout", 90000);
                  final int quiet = call.getInt("quiet", 9000);
                  final String js = call.getString("js", null);
                  getActivity().runOnUiThread(() -> {
                      try {
                          final ViewGroup root = (ViewGroup) getActivity().findViewById(android.R.id.content);
                          final LinearLayout box = new LinearLayout(getContext());
                          box.setOrientation(LinearLayout.VERTICAL); box.setBackgroundColor(0xFF0B0A1A);
                          final LinearLayout bar = new LinearLayout(getContext());
                          bar.setOrientation(LinearLayout.HORIZONTAL); bar.setGravity(Gravity.CENTER_VERTICAL);
                          bar.setPadding(px(20), px(40), px(14), px(14)); bar.setVisibility(View.GONE); bar.setBackgroundColor(0xFF14112E);
                          final TextView tv = new TextView(getContext());
                          tv.setText("Verificación rápida\nToca la casilla de abajo para ver en Latino");
                          tv.setTextColor(0xFFFFFFFF); tv.setTextSize(15); tv.setLineSpacing(px(2), 1f);
                          bar.addView(tv, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));
                          final Button bt = new Button(getContext()); bt.setText("Cancelar"); bt.setAllCaps(false);
                          bt.setTextColor(0xFFFFFFFF); bt.setBackgroundColor(0x33FFFFFF);
                          bar.addView(bt, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                          final WebView w = new WebView(getContext());
                          w.setBackgroundColor(0xFF0B0A1A);
                          final WebSettings st = w.getSettings();
                          st.setJavaScriptEnabled(true); st.setDomStorageEnabled(true);
                          CookieManager.getInstance().setAcceptCookie(true);
                          CookieManager.getInstance().setAcceptThirdPartyCookies(w, true);
                          box.addView(bar, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                          box.addView(w, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));
                          root.addView(box, 0, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          final Handler hd = new Handler(Looper.getMainLooper());
                          final boolean[] done = {false};
                          final boolean[] ran = {false};
                          /* deja solo la casilla de verificación sobre el fondo de la app (oculta textos, logo y pie de página) */
                          final String clean = "(function(){try{var b=document.body;if(!b)return;if(!document.getElementById('nxcf')){var s=document.createElement('style');s.id='nxcf';"
                              + "s.textContent='html,body{background:#0b0a1a!important;margin:0!important}body{min-height:100vh!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important}"
                              + "img,footer,.footer,h1,h2,.h1,.h2,#challenge-body-text,.core-msg{display:none!important}.main-wrapper,.main-content{margin:0 auto!important;padding:0!important;display:flex!important;flex-direction:column!important;align-items:center!important}';"
                              + "(document.head||document.documentElement).appendChild(s)}var a=b.querySelectorAll('*');for(var i=0;i<a.length;i++){var e=a[i],t=e.tagName;"
                              + "if(t==='IFRAME'||t==='SCRIPT'||t==='STYLE'||t==='INPUT')continue;if(e.querySelector('iframe'))continue;"
                              + "for(var n=e.firstChild;n;n=n.nextSibling){if(n.nodeType===3&&n.nodeValue.trim()){e.style.setProperty('display','none','important');break}}}}catch(x){}})()";
                          final long t0 = System.currentTimeMillis();
                          final String[] page = {"", ""};
                          final Runnable[] check = new Runnable[1];
                          final Runnable[] poll = new Runnable[1];
                          final java.util.function.Consumer<String> finish = res -> {
                              if (done[0]) return;
                              done[0] = true;
                              JSObject r = new JSObject();
                              r.put("title", page[0]); r.put("data", page[1]); r.put("url", w.getUrl());
                              r.put("ua", st.getUserAgentString());
                              r.put("cookie", CookieManager.getInstance().getCookie(url));
                              if (res != null) r.put("result", res);
                              call.resolve(r);
                              hd.post(() -> { try { root.removeView(box); w.stopLoading(); w.destroy(); } catch (Exception e) { } });
                          };
                          bt.setOnClickListener(v -> finish.accept("ERR cancelado"));
                          final Runnable hideBox = () -> {
                              if (bar.getVisibility() != View.VISIBLE) return;
                              bar.setVisibility(View.GONE); box.setElevation(0);
                              try { root.removeView(box); root.addView(box, 0, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)); } catch (Exception e) { }
                          };
                          check[0] = () -> {
                              if (done[0]) return;
                              w.evaluateJavascript("JSON.stringify([document.title||'',document.documentElement?document.documentElement.outerHTML:'',document.readyState||''])", v -> {
                                  if (done[0]) return;
                                  String title = "", html = "", rs = "";
                                  try { JSONArray a = new JSONArray(new JSONArray("[" + v + "]").getString(0)); title = a.getString(0); html = a.getString(1); rs = a.optString(2, ""); } catch (Exception e) { }
                                  page[0] = title; page[1] = html;
                                  String tl = title.toLowerCase();
                                  boolean chal = tl.contains("just a moment") || tl.contains("un momento") || tl.contains("checking") || html.length() < 2000;
                                  /* la página grande aún se está descargando: esperar a que esté completa */
                                  boolean loading = !chal && "loading".equals(rs);
                                  boolean wait = chal || loading;
                                  long el = System.currentTimeMillis() - t0;
                                  if (!chal) hideBox.run();
                                  if (wait) {
                                      if (chal) w.evaluateJavascript(clean, null);
                                      if (chal && el > quiet && bar.getVisibility() != View.VISIBLE) { bar.setVisibility(View.VISIBLE); box.bringToFront(); box.setElevation(px(60)); }
                                      hd.removeCallbacks(check[0]);
                                      if (el < tmo) hd.postDelayed(check[0], loading ? 400 : 800); else finish.accept(null);
                                      return;
                                  }
                                  if (js == null) { finish.accept(null); return; }
                                  if (ran[0]) return;
                                  ran[0] = true;
                                  w.evaluateJavascript(js, null);
                                  final long t1 = System.currentTimeMillis();
                                  poll[0] = () -> {
                                      if (done[0]) return;
                                      w.evaluateJavascript("(typeof window.__nxr==='string')?window.__nxr:null", x -> {
                                          if (done[0]) return;
                                          if (x != null && !x.equals("null")) { String sres = x; try { sres = new JSONArray("[" + x + "]").getString(0); } catch (Exception e) { } finish.accept(sres); return; }
                                          if (System.currentTimeMillis() - t1 < 25000) hd.postDelayed(poll[0], 400); else finish.accept("ERR tiempo agotado");
                                      });
                                  };
                                  hd.postDelayed(poll[0], 300);
                              });
                          };
                          w.setWebViewClient(new WebViewClient() {
                              /* Cloudflare ya dejó pasar y carga la página real: se esconde al instante */
                              @Override public void onPageStarted(WebView v, String u, Bitmap f) { hideBox.run(); }
                              @Override public void onPageFinished(WebView v, String u) { hd.removeCallbacks(check[0]); hd.postDelayed(check[0], 300); }
                          });
                          hd.postDelayed(() -> { if (!done[0]) finish.accept(null); }, tmo + 35000);
                          w.loadUrl(url);
                      } catch (Exception e) { call.reject(String.valueOf(e.getMessage())); }
                  });
              }

              /* Prueba con la app cerrada: el aviso sale a los segundos indicados */
              @PluginMethod
              public void testLater(PluginCall call) {
                  NexoraCheck.test(getContext(), call.getInt("sec", 30));
                  call.resolve();
              }

              @PluginMethod
              public void immersive(PluginCall call) {
                  final boolean on = Boolean.TRUE.equals(call.getBoolean("on", true));
                  getActivity().runOnUiThread(() -> {
                      try {
                          Window w = getActivity().getWindow();
                          WindowInsetsControllerCompat c = WindowCompat.getInsetsController(w, w.getDecorView());
                          if (on) {
                              WindowCompat.setDecorFitsSystemWindows(w, false);
                              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                              c.hide(WindowInsetsCompat.Type.systemBars());
                          } else {
                              c.show(WindowInsetsCompat.Type.systemBars());
                              WindowCompat.setDecorFitsSystemWindows(w, true);
                          }
                      } catch (Exception e) { }
                      call.resolve();
                  });
              }

              private boolean launch(Intent i) {
                  try { i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); getContext().startActivity(i); return true; } catch (Exception e) { return false; }
              }

              private boolean appDetails() {
                  return launch(new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + getContext().getPackageName())));
              }

              private void done(PluginCall call, boolean ok) { JSObject r = new JSObject(); r.put("ok", ok); call.resolve(r); }

              @PluginMethod
              public void openBattery(PluginCall call) {
                  Context c = getContext(); String pkg = c.getPackageName(); boolean ok = false;
                  if (Build.MANUFACTURER.toLowerCase().contains("xiaomi") || Build.BRAND.toLowerCase().matches(".*(redmi|poco|xiaomi).*")) {
                      Intent mi = new Intent(); mi.setComponent(new ComponentName("com.miui.powerkeeper", "com.miui.powerkeeper.ui.HiddenAppsConfigActivity"));
                      mi.putExtra("package_name", pkg); mi.putExtra("package_label", "Animes Nexora Plus"); ok = launch(mi);
                  }
                  if (!ok) {
                      try {
                          PowerManager pm = (PowerManager) c.getSystemService(Context.POWER_SERVICE);
                          if (pm != null && !pm.isIgnoringBatteryOptimizations(pkg)) ok = launch(new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + pkg)));
                      } catch (Exception e) { }
                  }
                  if (!ok) ok = launch(new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS));
                  if (!ok) ok = appDetails();
                  done(call, ok);
              }

              @PluginMethod
              public void openAutostart(PluginCall call) {
                  String[][] list = {
                      {"com.miui.securitycenter", "com.miui.permcenter.autostart.AutoStartManagementActivity"},
                      {"com.coloros.safecenter", "com.coloros.safecenter.permission.startup.StartupAppListActivity"},
                      {"com.oplus.safecenter", "com.oplus.safecenter.permission.startup.StartupAppListActivity"},
                      {"com.vivo.permissionmanager", "com.vivo.permissionmanager.activity.BgStartUpManagerActivity"},
                      {"com.huawei.systemmanager", "com.huawei.systemmanager.startupmgr.ui.StartupNormalAppListActivity"},
                      {"com.asus.mobilemanager", "com.asus.mobilemanager.MainActivity"},
                      {"com.letv.android.letvsafe", "com.letv.android.letvsafe.AutobootManageActivity"}
                  };
                  boolean ok = false;
                  for (String[] it : list) { Intent i = new Intent(); i.setComponent(new ComponentName(it[0], it[1])); if (launch(i)) { ok = true; break; } }
                  if (!ok) ok = appDetails();
                  done(call, ok);
              }

