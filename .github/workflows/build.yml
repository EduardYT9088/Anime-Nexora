# Animes Nexora Plus — compila el APK automáticamente a partir de index.html
# Ruta en el repo: .github/workflows/build.yml
name: Compilar APK

on:
  push:
    branches: [main, master]
    paths: ['index.html', '.github/workflows/build.yml']
  workflow_dispatch:
  schedule:
    - cron: '*/14 * * * *'   # despierta tu servidor cada 14 min (no compila el APK)

permissions:
  contents: write

env:
  APP_NAME: "Animes Nexora Plus"
  APP_VERSION: "1.2.6"   # <- cambia aquí la versión del APK
  APP_ID: "com.nexora.animesplus"
  # Pega aquí la dirección de tu servidor en Render (déjalo vacío si no usas servidor)
  SERVER_URL: ""

jobs:
  despertar:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Mantener el servidor despierto
        run: |
          if [ -z "$SERVER_URL" ]; then echo "Sin SERVER_URL, nada que hacer"; exit 0; fi
          curl -s -o /dev/null -w "Servidor respondió %{http_code}\n" --max-time 90 "${SERVER_URL%/}/health" || true

  apk:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Crear proyecto Capacitor
        run: |
          mkdir -p _build/www
          cp index.html _build/www/index.html
          # la versión de la app sale de APP_VERSION (se usa para avisar actualizaciones)
          sed -i "s/__APP_VERSION__/${APP_VERSION}/g" _build/www/index.html
          cd _build
          npm init -y > /dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 \
                @capacitor/app@6 @capacitor/screen-orientation@6 @capacitor/status-bar@6 \
                @capacitor/local-notifications@6 @capacitor/background-runner@2.0.0 \
                @capacitor/filesystem@6 @capawesome-team/capacitor-file-opener@6 \
                hls.js@1.5.17 qrcode@1.5.4
          cp node_modules/hls.js/dist/hls.min.js www/hls.min.js
          # Código QR de donación (PayPal) dentro de Ajustes
          cat > qr.js <<'EOF'
          const Q=require('qrcode'),fs=require('fs');
          Q.toString('https://www.paypal.me/EdwardAlvarado285',{type:'svg',margin:1,errorCorrectionLevel:'M',color:{dark:'#0b0a1a',light:'#ffffff'}}).then(svg=>{
            const f='www/index.html';const h=fs.readFileSync(f,'utf8');
            if(!h.includes('<!--NX_QR-->'))throw new Error('falta el marcador del QR');
            fs.writeFileSync(f,h.replace('<!--NX_QR-->',svg.replace(/<\?xml[^>]*>/,'').trim()));console.log('QR de donación listo');
          }).catch(e=>{console.error(e);process.exit(1)});
          EOF
          node qr.js
          # Revisión en segundo plano: avisa cuando sale un episodio nuevo de "Mi lista"
          mkdir -p www/runners
          cat > www/runners/nexora.js <<'EOF'
          function kvGet(k){ try{ const v = CapacitorKV.get(k); return typeof v === 'string' ? v : (v && v.value) || null; }catch(e){ return null; } }
          function kvSet(k,v){ try{ CapacitorKV.set(k, v); }catch(e){} }
          addEventListener('syncFavs', (resolve, reject, args) => {
            try{ kvSet('favs', JSON.stringify((args && args.favs) || [])); if (args && args.on !== undefined) kvSet('on', args.on ? '1' : '0'); resolve(); }catch(e){ reject(e); }
          });
          addEventListener('checkNew', async (resolve, reject) => {
            try{
              if (kvGet('on') === '0') { resolve(); return; }
              const favs = JSON.parse(kvGet('favs') || '[]'); let changed = false, id = Math.floor(Date.now()/1000) % 100000;
              for (const f of favs.slice(0, 25)) {
                try{
                  const m = (f.url || '').match(/\/media\/([^/?#]+)/); if (!m) continue;
                  const res = await fetch(f.url, { headers: { 'User-Agent': 'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36' } });
                  const html = await res.text(); const re = new RegExp('/media/' + m[1] + '/(\\d+)', 'g'); let mx = 0, r;
                  while ((r = re.exec(html))) mx = Math.max(mx, +r[1]);
                  const k = html.indexOf('episodes:['); if (k >= 0) { const part = html.slice(k, k + 400000), re2 = /"?number"?\s*:\s*(\d+)/g; while ((r = re2.exec(part))) mx = Math.max(mx, +r[1]); }
                  if (mx && f.last && mx > f.last) {
                    CapacitorNotifications.schedule([{ id: id++, title: 'Nuevo episodio en Nexora', body: (f.title || 'Tu anime') + ' · Episodio ' + mx + ' ya disponible', scheduleAt: new Date(Date.now() + 1000), smallIcon: 'ic_stat_nexora' }]);
                  }
                  if (mx && mx !== f.last) { f.last = mx; changed = true; }
                }catch(e){}
              }
              if (changed) kvSet('favs', JSON.stringify(favs));
              resolve();
            }catch(e){ reject(e); }
          });
          EOF
          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "www",
            "backgroundColor": "#070611",
            "server": { "androidScheme": "http", "cleartext": true },
            "android": { "allowMixedContent": true },
            "plugins": {
              "CapacitorHttp": { "enabled": false },
              "LocalNotifications": { "smallIcon": "ic_stat_nexora", "iconColor": "#8B6BFF" },
              "BackgroundRunner": { "label": "com.nexora.animesplus.check", "src": "runners/nexora.js", "event": "checkNew", "repeat": true, "interval": 30, "autoStart": true }
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Personalizar Android (icono, splash, permisos, versión)
        run: |
          cd _build/android/app/src/main
          RES=res
          # Permitir APIs http:// y pantalla completa de video
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:banner="@drawable\/nx_banner"/' AndroidManifest.xml
          # Android TV: aparece en el menú del televisor y no exige pantalla táctil
          sed -i 's|<application|<uses-feature android:name="android.software.leanback" android:required="false"/>\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>\n    <application|' AndroidManifest.xml
          sed -i -E 's|(<category android:name="android.intent.category.LAUNCHER" ?/>)|\1\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>|' AndroidManifest.xml
          grep -q LEANBACK_LAUNCHER AndroidManifest.xml && echo "Android TV OK" || { echo "No se pudo agregar Android TV"; exit 1; }

          # Colores propios
          cat > $RES/values/nx_colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="nx_bg">#070611</color>
            <color name="nx_a">#7C5CFF</color>
            <color name="nx_b">#22D3EE</color>
          </resources>
          EOF

          # Logo oficial Nexora: se toma la imagen que va dentro de index.html y se generan los iconos
          rm -f $RES/drawable*/ic_launcher_foreground.xml $RES/drawable*/ic_launcher_background.xml
          grep -o 'data:image/webp;base64,[A-Za-z0-9+/=]*' "$GITHUB_WORKSPACE/index.html" | head -1 | cut -d, -f2 | base64 -d > /tmp/nx_logo.webp
          pip install --quiet pillow
          python3 - "$RES" <<'PY'
          import os, sys
          from PIL import Image, ImageFilter, ImageDraw, ImageEnhance
          res = sys.argv[1]
          src = Image.open('/tmp/nx_logo.webp').convert('RGBA')
          def rounded(im, r):
              m = Image.new('L', im.size, 0); ImageDraw.Draw(m).rounded_rectangle([0, 0, im.size[0]-1, im.size[1]-1], radius=r, fill=255)
              out = Image.new('RGBA', im.size, (0, 0, 0, 0)); out.paste(im, (0, 0), m); return out
          def soft(size, f):
              m = Image.new('L', (size, size), 0); ImageDraw.Draw(m).ellipse([f, f, size-1-f, size-1-f], fill=255)
              return m.filter(ImageFilter.GaussianBlur(f*0.8))
          src = rounded(src, int(src.size[0]*.11))
          for d, px in {'mdpi':108,'hdpi':162,'xhdpi':216,'xxhdpi':324,'xxxhdpi':432}.items():
              os.makedirs(f'{res}/mipmap-{d}', exist_ok=True)
              # logo tal cual, completo dentro de la zona visible del icono, sobre fondo oscuro
              bg = Image.new('RGBA', (px, px), (11, 8, 26, 255))
              s = int(px*70/108); lg = src.resize((s, s), Image.LANCZOS)
              bg.paste(lg, ((px-s)//2, (px-s)//2), lg)
              bg.save(f'{res}/mipmap-{d}/nx_ic_bg.png')
              Image.new('RGBA', (px, px), (0, 0, 0, 0)).save(f'{res}/mipmap-{d}/nx_ic_fg.png')
          for d, px in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              ic = src.resize((px, px), Image.LANCZOS)
              ic.save(f'{res}/mipmap-{d}/ic_launcher.png'); ic.save(f'{res}/mipmap-{d}/ic_launcher_round.png')
          os.makedirs(f'{res}/drawable-nodpi', exist_ok=True)
          src.resize((640, 640), Image.LANCZOS).save(f'{res}/drawable-nodpi/nx_logo_img.png')
          # banner para el menú de Android TV (320x180)
          os.makedirs(f'{res}/drawable-xhdpi', exist_ok=True)
          ban = Image.new('RGBA', (320, 180), (11, 8, 26, 255)); g = ImageDraw.Draw(ban)
          for y in range(180): g.line([(0, y), (320, y)], fill=(int(40-22*y/180), int(22-12*y/180), int(92-50*y/180), 255))
          lg = src.resize((164, 164), Image.LANCZOS); ban.paste(lg, (78, 8), lg)
          ban.save(f'{res}/drawable-xhdpi/nx_banner.png')
          print('iconos generados')
          PY
          cat > $RES/drawable/ic_stat_nexora.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:pathData="M7,18V6l10,12V6" android:strokeColor="#FFFFFFFF" android:strokeWidth="2.6"
                android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000"/>
          </vector>
          EOF
          # permiso para instalar la actualización descargada desde la app
          grep -q REQUEST_INSTALL_PACKAGES AndroidManifest.xml || sed -i 's|<application|<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <application|' AndroidManifest.xml
          grep -q POST_NOTIFICATIONS AndroidManifest.xml || sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application|' AndroidManifest.xml
          cat > $RES/drawable/nx_icon_mono.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <group android:scaleX="0.86" android:scaleY="0.86" android:pivotX="54" android:pivotY="54">
              <path android:pathData="M38,71V37l32,34V37"
                  android:strokeColor="#FFFFFFFF" android:strokeWidth="9"
                  android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000"/>
            </group>
          </vector>
          EOF
          mkdir -p $RES/mipmap-anydpi-v26
          for n in ic_launcher ic_launcher_round; do
          cat > $RES/mipmap-anydpi-v26/$n.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@mipmap/nx_ic_bg"/>
            <foreground android:drawable="@mipmap/nx_ic_fg"/>
            <monochrome android:drawable="@drawable/nx_icon_mono"/>
          </adaptive-icon>
          EOF
          done

          # Pantalla de carga: fondo oscuro + logo oficial
          find $RES -name 'splash.png' -delete
          cat > $RES/drawable/splash.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:drawable="@color/nx_bg"/>
            <item android:width="220dp" android:height="220dp" android:gravity="center" android:drawable="@drawable/nx_logo_img"/>
          </layer-list>
          EOF
          # Versión automática (Android 8+ para que el icono oficial se vea en todos los equipos)
          cd ../../
          sed -i 's/minSdkVersion = 2[0-9]/minSdkVersion = 26/' ../variables.gradle
          # librería que necesita el revisor en segundo plano
          sed -i "/dirs '..\/capacitor-cordova-android-plugins/ s#'libs'#'libs', '../../node_modules/@capacitor/background-runner/android/src/main/libs'#" build.gradle
          grep -n "background-runner/android" build.gradle || echo "AVISO: flatDir no modificado"
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${APP_VERSION}\"/" build.gradle

      - name: Firma fija del APK (para poder actualizar sin desinstalar)
        env:
          NEXORA_KEYSTORE: ${{ secrets.NEXORA_KEYSTORE }}
        run: |
          if [ -n "$NEXORA_KEYSTORE" ]; then
            echo "$NEXORA_KEYSTORE" | base64 -d > _build/android/app/nexora.keystore
            sed -i "0,/^android {/s//android {\n    signingConfigs { debug { storeFile file('nexora.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }/" _build/android/app/build.gradle
            grep -q "nexora.keystore" _build/android/app/build.gradle && echo "Firma Nexora OK" || { echo "No se pudo configurar la firma"; exit 1; }
          else
            echo "::warning::Falta el secreto NEXORA_KEYSTORE. El APK se firmará con una clave temporal y no se podrá instalar encima de la versión anterior."
          fi

      - name: Compilar APK
        run: |
          cd _build/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../../out
          AS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner; "$AS" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "DN\|SHA-256" || true
          cp app/build/outputs/apk/debug/app-debug.apk "../../out/AnimesNexoraPlus-v${APP_VERSION}.apk"

      - name: Subir APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: AnimesNexoraPlus-APK
          path: out/*.apk

      - name: Reemplazar release anterior de la misma versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v${APP_VERSION}" --cleanup-tag -y --repo "${{ github.repository }}" || true

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Animes Nexora Plus v${{ env.APP_VERSION }}
          make_latest: true
          body: |
            ${{ github.event.head_commit.message || 'Nueva versión de Animes Nexora Plus' }}
          files: out/*.apk
