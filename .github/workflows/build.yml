          /**
           * Revisor nativo de episodios nuevos (Android WorkManager, cada 15 min aunque la app esté cerrada)
           * y publicador de notificaciones en la barra de estado con su propio canal.
           */
          public class NexoraCheck extends Worker {
              static final String PREFS = "nexora_chk";
              static final String CH = "nexora_episodios";
              static final String SITE = "https://animeav1.com";
              static final String UA = "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36";

              public NexoraCheck(@NonNull Context c, @NonNull WorkerParameters p) { super(c, p); }

              public static void schedule(Context c) {
                  try {
                      Constraints k = new Constraints.Builder().setRequiredNetworkType(NetworkType.CONNECTED).build();
                      PeriodicWorkRequest r = new PeriodicWorkRequest.Builder(NexoraCheck.class, 15, TimeUnit.MINUTES).setConstraints(k).build();
                      WorkManager.getInstance(c).enqueueUniquePeriodicWork("nexora_check", ExistingPeriodicWorkPolicy.KEEP, r);
                  } catch (Exception e) { }
              }

              public static void test(Context c, long sec) {
                  try {
                      OneTimeWorkRequest r = new OneTimeWorkRequest.Builder(NexoraCheck.class)
                          .setInitialDelay(sec, TimeUnit.SECONDS)
                          .setInputData(new Data.Builder().putBoolean("test", true).build()).build();
                      WorkManager.getInstance(c).enqueue(r);
                  } catch (Exception e) { }
              }

              static String get(String u) throws Exception {
                  HttpURLConnection h = (HttpURLConnection) new URL(u).openConnection();
                  h.setRequestProperty("User-Agent", UA);
                  h.setRequestProperty("Accept-Language", "es-ES,es;q=0.9");
                  h.setConnectTimeout(15000); h.setReadTimeout(25000); h.setInstanceFollowRedirects(true);
                  try (InputStream in = h.getInputStream()) {
                      ByteArrayOutputStream o = new ByteArrayOutputStream(); byte[] b = new byte[16384]; int n;
                      while ((n = in.read(b)) > 0) { o.write(b, 0, n); if (o.size() > 6000000) break; }
                      return o.toString("UTF-8");
                  } finally { h.disconnect(); }
              }

              static String slug(String url) {
                  Matcher m = Pattern.compile("/media/([^/?#]+)").matcher(url == null ? "" : url);
                  return m.find() ? m.group(1) : null;
              }

              static String niceSlug(String s) {
                  String t = s.replace('-', ' ');
                  return t.isEmpty() ? t : Character.toUpperCase(t.charAt(0)) + t.substring(1);
              }

              /* ---- lectura del objeto { ... slug:"x" ... } que rodea a un anime en la página ---- */
              static int[] objAround(String h, int i) {
                  int d = 0, s = -1;
                  for (int j = i - 1; j >= 0 && j > i - 20000; j--) {
                      char ch = h.charAt(j);
                      if (ch == '}') d++;
                      else if (ch == '{') { if (d == 0) { s = j; break; } d--; }
                  }
                  if (s < 0) return null;
                  d = 0; boolean q = false;
                  for (int j = s; j < h.length() && j < s + 40000; j++) {
                      char ch = h.charAt(j);
                      if (q) { if (ch == '\\') j++; else if (ch == '"') q = false; continue; }
                      if (ch == '"') q = true;
                      else if (ch == '{') d++;
                      else if (ch == '}') { d--; if (d == 0) return new int[]{s, j + 1}; }
                  }
                  return null;
              }

              /** Valor de una clave del primer nivel del objeto (texto o número), o null. */
              static String topField(String o, String key) {
                  int d = 0; boolean q = false;
                  for (int j = 0; j < o.length(); j++) {
                      char ch = o.charAt(j);
                      if (q) { if (ch == '\\') j++; else if (ch == '"') q = false; continue; }
                      if (ch == '"') { q = true; continue; }
                      if (ch == '{' || ch == '[') d++;
                      else if (ch == '}' || ch == ']') d--;
                      if (d == 1 && (ch == '{' || ch == ',')) {
                          int k = j + 1; while (k < o.length() && o.charAt(k) == ' ') k++;
                          String a = key + ":", b = "\"" + key + "\":";
                          int v = o.startsWith(a, k) ? k + a.length() : o.startsWith(b, k) ? k + b.length() : -1;
                          if (v > 0) {
                              while (v < o.length() && o.charAt(v) == ' ') v++;
                              if (v < o.length() && o.charAt(v) == '"') {
                                  int e = v + 1; while (e < o.length() && o.charAt(e) != '"') { if (o.charAt(e) == '\\') e++; e++; }
                                  try { return new JSONArray("[" + o.substring(v, e + 1) + "]").getString(0); } catch (Exception x) { return o.substring(v + 1, e); }
                              }
                              int e = v; while (e < o.length() && Character.isDigit(o.charAt(e))) e++;
                              return e > v ? o.substring(v, e) : null;
                          }
                      }
                  }
                  return null;
              }

              static String[] info(String h, String sl) {
                  String title = null, img = null;
                  int i = h.indexOf("slug:\"" + sl + "\""); if (i < 0) i = h.indexOf("\"slug\":\"" + sl + "\"");
                  if (i >= 0) {
                      int[] r = objAround(h, i);
                      if (r != null) {
                          String o = h.substring(r[0], r[1]);
                          title = topField(o, "title");
                          String id = topField(o, "id");
                          if (id != null && id.matches("\\d+")) img = "https://cdn.animeav1.com/covers/" + id + ".jpg";
                      }
                  }
                  if (title == null || title.trim().length() < 2) title = niceSlug(sl);
                  return new String[]{title, img};
              }

              /** Número de episodio más alto de la página de un anime. */
              static int maxEp(String h, String sl) {
                  int mx = 0;
                  Matcher m = Pattern.compile("/media/" + Pattern.quote(sl) + "/(\\d+)").matcher(h);
                  while (m.find()) mx = Math.max(mx, Integer.parseInt(m.group(1)));
                  int k = h.indexOf("episodes:[");
                  if (k >= 0) {
                      int s = k + 9, d = 0, e = Math.min(h.length(), s + 400000); boolean q = false;
                      for (int j = s; j < Math.min(h.length(), s + 400000); j++) {
                          char ch = h.charAt(j);
                          if (q) { if (ch == '\\') j++; else if (ch == '"') q = false; continue; }
                          if (ch == '"') q = true; else if (ch == '[') d++; else if (ch == ']') { d--; if (d == 0) { e = j; break; } }
                      }
                      Matcher m2 = Pattern.compile("\"?number\"?\\s*:\\s*(\\d+)").matcher(h.substring(s, e));
                      while (m2.find()) mx = Math.max(mx, Integer.parseInt(m2.group(1)));
                  }
                  return mx;
              }

              static JSONObject item(String sl, int ep, String title, String url, String image) throws Exception {
                  return new JSONObject().put("key", sl + "#" + ep).put("ep", ep).put("title", title).put("url", url).put("image", image == null ? "" : image);
              }

              @NonNull
              @Override
              public Result doWork() {
                  Context c = getApplicationContext();
                  if (getInputData().getBoolean("test", false)) {
                      JSONArray t = new JSONArray();
                      try { t.put(new JSONObject().put("key", "test#" + System.currentTimeMillis()).put("test", true)
                          .put("title", "Prueba de Nexora").put("body", "¡Los avisos con la app cerrada funcionan! 🎉")); } catch (Exception e) { }
                      post(c, t, false);
                      return Result.success();
                  }
                  SharedPreferences sp = c.getSharedPreferences(PREFS, 0);
                  JSONArray news = new JSONArray();
                  try {
                      boolean on = sp.getBoolean("on", true), all = sp.getBoolean("all", true);
                      JSONArray favs = new JSONArray(sp.getString("favs", "[]"));
                      Set<String> favSlugs = new HashSet<>();
                      for (int i = 0; i < favs.length(); i++) { String s = slug(favs.getJSONObject(i).optString("url")); if (s != null) favSlugs.add(s); }
                      if (on) {
                          boolean changed = false;
                          for (int i = 0; i < Math.min(25, favs.length()); i++) {
                              JSONObject f = favs.getJSONObject(i); String sl = slug(f.optString("url")); if (sl == null) continue;
                              try {
                                  int mx = maxEp(get(f.optString("url")), sl), last = f.optInt("last", 0);
                                  if (mx > 0 && last > 0 && mx > last)
                                      news.put(item(sl, mx, f.optString("title", niceSlug(sl)), f.optString("url"), f.optString("image", "")));
                                  if (mx > 0 && mx != last) { f.put("last", mx); changed = true; }
                              } catch (Exception e) { }
                          }
                          if (changed) sp.edit().putString("favs", favs.toString()).apply();
                      }
                      if (all) {
                          String h = get(SITE + "/");
                          Matcher m = Pattern.compile("/media/([a-z0-9-]+)/(\\d+)").matcher(h);
                          LinkedHashSet<String> keys = new LinkedHashSet<>();
                          while (m.find()) keys.add(m.group(1) + "#" + m.group(2));
                          if (!keys.isEmpty()) {
                              String raw = sp.getString("seen", null);
                              LinkedHashSet<String> merged = new LinkedHashSet<>(keys);
                              if (raw != null) {
                                  JSONArray sa = new JSONArray(raw); Set<String> seen = new HashSet<>();
                                  for (int i = 0; i < sa.length(); i++) seen.add(sa.getString(i));
                                  int cnt = 0;
                                  for (String k : keys) {
                                      if (cnt >= 24) break;
                                      String[] p = k.split("#");
                                      if (seen.contains(k) || favSlugs.contains(p[0])) continue;
                                      String[] inf = info(h, p[0]);
                                      news.put(item(p[0], Integer.parseInt(p[1]), inf[0], SITE + "/media/" + p[0], inf[1])); cnt++;
                                  }
                                  for (int i = 0; i < sa.length() && merged.size() < 300; i++) merged.add(sa.getString(i));
                              }
                              sp.edit().putString("seen", new JSONArray(new ArrayList<>(merged)).toString()).apply();
                          }
                      }
                  } catch (Exception e) { }
                  if (news.length() > 0) post(c, news, false);
                  return Result.success();
              }

              static void ensureChannel(Context c) {
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  if (nm == null || nm.getNotificationChannel(CH) != null) return;
                  NotificationChannel ch = new NotificationChannel(CH, "Episodios nuevos", NotificationManager.IMPORTANCE_HIGH);
                  ch.setDescription("Aviso cuando sale un capítulo nuevo");
                  ch.enableLights(true); ch.setLightColor(0xFF8B6BFF); ch.setShowBadge(true);
                  nm.createNotificationChannel(ch);
              }

              static Bitmap poster(String u) {
                  if (u == null || u.isEmpty()) return null;
                  try {
                      HttpURLConnection h = (HttpURLConnection) new URL(u).openConnection();
                      h.setRequestProperty("User-Agent", UA); h.setConnectTimeout(8000); h.setReadTimeout(10000);
                      try (InputStream in = h.getInputStream()) {
                          ByteArrayOutputStream o = new ByteArrayOutputStream(); byte[] b = new byte[16384]; int n;
                          while ((n = in.read(b)) > 0) { o.write(b, 0, n); if (o.size() > 4000000) return null; }
                          byte[] a = o.toByteArray();
                          BitmapFactory.Options op = new BitmapFactory.Options(); op.inJustDecodeBounds = true;
                          BitmapFactory.decodeByteArray(a, 0, a.length, op);
                          int s = 1; while (op.outWidth / (s * 2) >= 256) s *= 2;
                          op = new BitmapFactory.Options(); op.inSampleSize = s;
                          return BitmapFactory.decodeByteArray(a, 0, a.length, op);
                      } finally { h.disconnect(); }
                  } catch (Exception e) { return null; }
              }

              static PendingIntent open(Context c, int code, String url, int ep, boolean inbox) {
                  Intent i = new Intent(c, MainActivity.class);
                  i.setAction("nexora.open." + code);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  if (url != null && !url.isEmpty()) { i.putExtra("nx_url", url); i.putExtra("nx_ep", ep); }
                  if (inbox) i.putExtra("nx_inbox", true);
                  return PendingIntent.getActivity(c, code, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              /** Publica en la barra de estado (sin repetir el mismo episodio) y guarda lo hallado para la campana de la app. */
              @SuppressLint("MissingPermission")
              static synchronized void post(Context c, JSONArray items, boolean fromApp) {
                  try {
                      SharedPreferences sp = c.getSharedPreferences(PREFS, 0);
                      List<String> done = new ArrayList<>();
                      JSONArray da = new JSONArray(sp.getString("notified", "[]"));
                      for (int i = 0; i < da.length(); i++) done.add(da.getString(i));
                      JSONArray pend = new JSONArray(sp.getString("inbox", "[]"));
                      List<JSONObject> fresh = new ArrayList<>();
                      for (int i = 0; i < items.length(); i++) {
                          JSONObject it = items.getJSONObject(i);
                          if (it.optBoolean("test")) { fresh.add(it); continue; }
                          String k = it.optString("key"); if (k.isEmpty() || done.contains(k)) continue;
                          done.add(k); fresh.add(it);
                          if (!fromApp) pend.put(new JSONObject().put("url", it.optString("url")).put("title", it.optString("title"))
                              .put("ep", it.optInt("ep")).put("image", it.optString("image")).put("ts", System.currentTimeMillis()));
                      }
                      while (done.size() > 400) done.remove(0);
                      JSONArray pk = new JSONArray(); for (int i = Math.max(0, pend.length() - 60); i < pend.length(); i++) pk.put(pend.get(i));
                      sp.edit().putString("notified", new JSONArray(done).toString()).putString("inbox", pk.toString()).apply();
                      if (fresh.isEmpty()) return;
                      NotificationManagerCompat nm = NotificationManagerCompat.from(c);
                      if (!nm.areNotificationsEnabled()) return;
                      ensureChannel(c);
                      if (fresh.size() <= 3) {
                          for (JSONObject it : fresh) {
                              boolean test = it.optBoolean("test");
                              int id = it.optString("key").hashCode() & 0x7fffffff;
                              String title = it.optString("title", "Animes Nexora Plus");
                              String text = test ? it.optString("body") : "Episodio " + it.optInt("ep") + " ya disponible · Toca para verlo";
                              NotificationCompat.Builder b = new NotificationCompat.Builder(c, CH)
                                  .setSmallIcon(R.drawable.ic_stat_nexora).setColor(0xFF8B6BFF)
                                  .setContentTitle(title).setContentText(text)
                                  .setStyle(new NotificationCompat.BigTextStyle().bigText(text))
                                  .setSubText(test ? "Prueba" : "Nuevo episodio")
                                  .setPriority(NotificationCompat.PRIORITY_HIGH).setAutoCancel(true)
                                  .setDefaults(NotificationCompat.DEFAULT_ALL)
                                  .setContentIntent(open(c, id, it.optString("url"), it.optInt("ep"), false));
                              Bitmap bm = test ? null : poster(it.optString("image")); if (bm != null) b.setLargeIcon(bm);
                              try { nm.notify(id, b.build()); } catch (SecurityException e) { }
                          }
                      } else {
                          NotificationCompat.InboxStyle st = new NotificationCompat.InboxStyle();
                          StringBuilder sb = new StringBuilder();
                          for (int i = 0; i < fresh.size() && i < 6; i++) {
                              JSONObject it = fresh.get(i); String line = it.optString("title") + " · Ep. " + it.optInt("ep");
                              st.addLine(line); if (i < 3) sb.append(i > 0 ? ", " : "").append(it.optString("title"));
                          }
                          if (fresh.size() > 6) st.setSummaryText("+" + (fresh.size() - 6) + " más");
                          String title = fresh.size() + " episodios nuevos en Nexora";
                          NotificationCompat.Builder b = new NotificationCompat.Builder(c, CH)
                              .setSmallIcon(R.drawable.ic_stat_nexora).setColor(0xFF8B6BFF)
                              .setContentTitle(title).setContentText(sb.toString()).setStyle(st.setBigContentTitle(title))
                              .setNumber(fresh.size()).setPriority(NotificationCompat.PRIORITY_HIGH).setAutoCancel(true)
                              .setDefaults(NotificationCompat.DEFAULT_ALL)
                              .setContentIntent(open(c, 4242, null, 0, true));
                          try { nm.notify(4242, b.build()); } catch (SecurityException e) { }
                      }
                  } catch (Exception e) { }
              }
          }
          JAVA
          sed -i "s/__PKG__/${APP_ID}/" $JDIR/NexoraCheck.java
          grep -q "package ${APP_ID};" $JDIR/NexoraCheck.java && echo "Revisor nativo OK" || { echo "No se pudo crear el revisor"; exit 1; }

      - name: Firma fija del APK (para poder actualizar sin desinstalar)
        env:
          NEXORA_KEYSTORE: ${{ secrets.NEXORA_KEYSTORE }}
        run: |
          if [ -n "$NEXORA_KEYSTORE" ]; then
            echo "$NEXORA_KEYSTORE" | base64 -d > _build/android/app/nexora.keystore
            sed -i "0,/^android {/s//android {\n    signingConfigs { debug { storeFile file('nexora.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }/" _build/android/app/build.gradle
            grep -q "nexora.keystore" _build/android/app/build.gradle && echo "Firma Nexora OK" || { echo "No se pudo configurar la firma"; exit 1; }
          else
            echo "::warning::Falta el secreto NEXORA_KEYSTORE. El APK se firmará con una clave temporal y no se podrá instalar encima de la versión anterior."
          fi

      - name: Compilar APK
        run: |
          cd _build/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../../out
          AS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner; "$AS" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "DN\|SHA-256" || true
          cp app/build/outputs/apk/debug/app-debug.apk "../../out/AnimesNexoraPlus-v${APP_VERSION}.apk"
          # Copia con nombre fijo: el enlace .../releases/latest/download/AnimesNexoraPlus.apk siempre da la última versión oficial
          cp app/build/outputs/apk/debug/app-debug.apk "../../out/AnimesNexoraPlus.apk"

      - name: Subir APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: AnimesNexoraPlus-APK
          path: out/*.apk

      # Desde main = versión oficial (la app la ofrece como actualización).
      # Desde otra rama = versión de prueba aparte: la app NO la ofrece a nadie.
      - name: Reemplazar release anterior de la misma versión
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ env.APP_VERSION }}${{ (github.ref_name != 'main' && github.ref_name != 'master') && '-prueba' || '' }}
        run: gh release delete "$TAG" --cleanup-tag -y --repo "${{ github.repository }}" || true

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}${{ (github.ref_name != 'main' && github.ref_name != 'master') && '-prueba' || '' }}
          name: Animes Nexora Plus v${{ env.APP_VERSION }}${{ (github.ref_name != 'main' && github.ref_name != 'master') && ' (PRUEBA)' || '' }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name != 'main' && github.ref_name != 'master' }}
          make_latest: ${{ github.ref_name == 'main' || github.ref_name == 'master' }}
          body: |
            ${{ (github.ref_name != 'main' && github.ref_name != 'master') && 'Versión de PRUEBA, solo para probar. No es la oficial y la app no la ofrece como actualización.' || (github.event.head_commit.message || 'Nueva versión de Animes Nexora Plus') }}
          files: out/*.apk
