name: Compilar APK Animes Nexora

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Aplicar icono de Nexora
        run: |
          rm -rf android/app/src/main/res/mipmap-*
          cp -r resources/android/mipmap-* android/app/src/main/res/

      - name: Sincronizar la web con Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Animes-Nexora.apk

      - name: Subir APK como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: Animes-Nexora-APK
          path: Animes-Nexora.apk

      - name: Publicar en Releases (solo con etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Animes-Nexora.apk
