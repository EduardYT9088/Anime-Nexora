name: Compilar APK
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36'
          for s in kusuriya-no-hitorigoto-2nd-season cyberpunk-edgerunners-2 shingeki-no-kyojin boku-no-hero-academia-7th-season; do
            echo "== $s"; curl -s -A "$UA" https://animeav1.com/media/$s | python3 -c "
          import sys,re
          h=sys.stdin.read(); i=h.find('relations:')
          print(h[i:i+2500] if i>=0 else 'sin relations')"
          done
          echo "== busqueda kusuriya"; curl -s -A "$UA" "https://animeav1.com/catalogo?search=kusuriya" | python3 -c "
          import sys,re
          h=sys.stdin.read(); print(sorted(set(re.findall(r'/media/([a-z0-9-]+)',h)))); i=h.find('kusuriya'); print(h[i-300:i+400])"
