              for nu in 1 2; do U=$(curl -s -m 20 -A "$UA" -X POST -H 'X-Requested-With: XMLHttpRequest' --data "action=doo_player_ajax&post=$P&nume=$nu&type=tv" "$B/wp-admin/admin-ajax.php" | python3 -c "import sys,json;print(json.load(sys.stdin).get('embed_url') or '')" 2>/dev/null)
