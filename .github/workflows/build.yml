name: Compilar APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; mkdir out; cd out
          UA='Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36'
          g(){ code=$(curl -s -L -m 30 -A "$UA" -H 'Accept-Language: es-ES,es;q=0.9' -o "$1" -w '%{http_code}' "$2"); echo "$1 $code $(wc -c < "$1") $2" | tee -a index.txt; }
          g kitsu.json "https://kitsu.io/api/edge/anime?filter%5Btext%5D=Kikansha%20no%20Mahou%20wa%20Tokubetsu%20desu&page%5Blimit%5D=2&fields%5Banime%5D=canonicalTitle,posterImage,coverImage"
          g jikan.json "https://api.jikan.moe/v4/anime?q=Kikansha%20no%20Mahou%20wa%20Tokubetsu%20desu&limit=2"
          K=$(python3 -c "import json;d=json.load(open('kitsu.json'))['data'][0]['attributes'];print((d.get('coverImage') or {}).get('original',''))" 2>/dev/null); [ -n "$K" ] && g kcover.jpg "$K"
          P=$(python3 -c "import json;d=json.load(open('kitsu.json'))['data'][0]['attributes'];print((d.get('posterImage') or {}).get('original',''))" 2>/dev/null); [ -n "$P" ] && g kposter.jpg "$P"
          J=$(python3 -c "import json;d=json.load(open('jikan.json'))['data'][0];print(d['images']['jpg']['large_image_url'])" 2>/dev/null); [ -n "$J" ] && g jposter.jpg "$J"
          python3 - <<'PY' >> index.txt
          import struct,glob
          def size(f):
              d=open(f,'rb').read()
              if d[:2]!=b'\xff\xd8': return 'no-jpg'
              i=2
              while i<len(d):
                  if d[i]!=0xFF: i+=1; continue
                  m=d[i+1]
                  if m in (0xC0,0xC1,0xC2):
                      h,w=struct.unpack('>HH',d[i+5:i+9]); return f'{w}x{h}'
                  l=struct.unpack('>H',d[i+2:i+4])[0]; i+=2+l
              return '?'
          for f in sorted(glob.glob('*.jpg')): print('SIZE',f,size(f))
          PY
          git init -q && git checkout -q -b diag-datos && git add -A && git -c user.name=diag -c user.email=diag@x commit -q -m datos
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-datos
