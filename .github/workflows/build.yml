name: Compilar APK
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA='Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36'
          B=https://ww4.animeonline.ninja
          cnt(){ python3 -c "
          import sys,re
          h=sys.stdin.read()
          out=[]
          for lang in ['SUB','LAT','ES']:
              m=re.search(r'class=\"OD OD_'+lang+r'[^\"]*\">([\s\S]*?)</div>',h)
              out.append(lang+'='+str(len(re.findall(r'go_to_player',m.group(1))) if m else 0))
          print(' '.join(out))"; }
          for n in 1 100 200 300 400 500 600 700 800 900 950 1000 1050 1080 1090 1100; do
            P=$(curl -s -m 25 -A "$UA" "$B/episodio/one-piece-cap-$n/" | grep -o "data-post='[0-9]*'" | head -1 | grep -o '[0-9]*')
            r=""
            for nu in 1 2 3; do U=$(curl -s -m 20 -A "$UA" -X POST -H 'X-Requested-With: XMLHttpRequest' --data "action=doo_player_ajax&post=$P&nume=$nu&type=tv" "$B/wp-admin/admin-ajax.php" | python3 -c "import sys,json;print(json.load(sys.stdin).get('embed_url') or '')" 2>/dev/null)
              [ -z "$U" ] && break
              r="$r | opt$nu: $(curl -s -m 25 -A "$UA" -H "Referer: $B/" "$U" | cnt)"; done
            echo "ep $n (post $P)$r"
          done
