          import android.provider.Settings;
          import android.content.res.Configuration;
          import android.view.Window;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "NexoraScreen")
          public class NexoraScreen extends Plugin {
              @Override
              public void load() {
                  NexoraCheck.schedule(getContext());
                  try { fromNotification(getActivity().getIntent()); } catch (Exception e) { }
              }

              @Override
              protected void handleOnNewIntent(Intent intent) {
                  super.handleOnNewIntent(intent);
                  fromNotification(intent);
              }

              /* Al tocar una notificación: abre el anime o la campana dentro de la app */
              private void fromNotification(Intent i) {
                  if (i == null) return;
                  String u = i.getStringExtra("nx_url");
                  boolean inbox = i.getBooleanExtra("nx_inbox", false);
                  if (u == null && !inbox) return;
                  JSObject d = new JSObject();
                  if (u != null) { d.put("url", u); d.put("ep", i.getIntExtra("nx_ep", 0)); }
                  d.put("inbox", inbox);
                  i.removeExtra("nx_url"); i.removeExtra("nx_inbox");
                  notifyListeners("nxOpen", d, true);
              }

              /* Datos para el revisor nativo: Mi lista, ajustes y episodios ya vistos */
              @PluginMethod
              public void syncCheck(PluginCall call) {
                  try {
                      SharedPreferences sp = getContext().getSharedPreferences(NexoraCheck.PREFS, 0);
                      SharedPreferences.Editor ed = sp.edit();
                      ed.putBoolean("on", Boolean.TRUE.equals(call.getBoolean("on", true)));
                      ed.putBoolean("all", Boolean.TRUE.equals(call.getBoolean("all", true)));
                      JSArray favs = call.getArray("favs", null);
                      if (favs != null) {
                          JSONArray old = new JSONArray(sp.getString("favs", "[]"));
                          for (int i = 0; i < favs.length(); i++) {
                              org.json.JSONObject f = favs.getJSONObject(i);
                              for (int j = 0; j < old.length(); j++) {
                                  org.json.JSONObject o = old.getJSONObject(j);
                                  if (o.optString("url").equals(f.optString("url")) && o.optInt("last", 0) > f.optInt("last", 0)) f.put("last", o.optInt("last"));
                              }
                          }
                          ed.putString("favs", favs.toString());
                      }
                      JSArray seen = call.getArray("seen", null);
                      if (seen != null && seen.length() > 0) {
                          java.util.LinkedHashSet<String> m = new java.util.LinkedHashSet<>();
                          JSONArray old = new JSONArray(sp.getString("seen", "[]"));
                          for (int i = 0; i < seen.length(); i++) m.add(seen.getString(i));
                          for (int i = 0; i < old.length() && m.size() < 300; i++) m.add(old.getString(i));
                          ed.putString("seen", new JSONArray(new java.util.ArrayList<>(m)).toString());
                      }
                      ed.apply();
                      NexoraCheck.schedule(getContext());
                  } catch (Exception e) { }
                  call.resolve();
              }

              /* Publica en la barra de estado los episodios que encontró la app abierta */
              @PluginMethod
              public void postEpisodes(PluginCall call) {
                  final JSArray items = call.getArray("items", new JSArray());
                  final Context c = getContext();
                  new Thread(() -> {
                      try { NexoraCheck.post(c, new JSONArray(items.toString()), true); } catch (Exception e) { }
                  }).start();
                  call.resolve();
              }

              /* Lo que encontró el revisor con la app cerrada, para la campana */
              @PluginMethod
              public void takeInbox(PluginCall call) {
                  JSObject r = new JSObject();
                  try {
                      SharedPreferences sp = getContext().getSharedPreferences(NexoraCheck.PREFS, 0);
                      r.put("items", new JSArray(sp.getString("inbox", "[]")));
                      sp.edit().putString("inbox", "[]").apply();
                  } catch (Exception e) { r.put("items", new JSArray()); }
                  call.resolve(r);
              }

              @PluginMethod
              public void notifState(PluginCall call) {
                  boolean on = false;
                  try {
                      on = NotificationManagerCompat.from(getContext()).areNotificationsEnabled();
                      NotificationManager nm = getContext().getSystemService(NotificationManager.class);
                      NotificationChannel ch = nm == null ? null : nm.getNotificationChannel(NexoraCheck.CH);
                      if (ch != null && ch.getImportance() == NotificationManager.IMPORTANCE_NONE) on = false;
                  } catch (Exception e) { }
                  JSObject r = new JSObject(); r.put("enabled", on); call.resolve(r);
              }

              @PluginMethod
              public void openNotifSettings(PluginCall call) {
                  Intent i = new Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS);
                  i.putExtra(Settings.EXTRA_APP_PACKAGE, getContext().getPackageName());
                  boolean ok = launch(i);
                  if (!ok) ok = appDetails();
                  done(call, ok);
              }

              /* Prueba con la app cerrada: el aviso sale a los segundos indicados */
              @PluginMethod
              public void testLater(PluginCall call) {
                  NexoraCheck.test(getContext(), call.getInt("sec", 30));
                  call.resolve();
              }

              @PluginMethod
              public void immersive(PluginCall call) {
                  final boolean on = Boolean.TRUE.equals(call.getBoolean("on", true));
                  getActivity().runOnUiThread(() -> {
                      try {
                          Window w = getActivity().getWindow();
                          WindowInsetsControllerCompat c = WindowCompat.getInsetsController(w, w.getDecorView());
                          if (on) {
                              WindowCompat.setDecorFitsSystemWindows(w, false);
                              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                              c.hide(WindowInsetsCompat.Type.systemBars());
                          } else {
                              c.show(WindowInsetsCompat.Type.systemBars());
                              WindowCompat.setDecorFitsSystemWindows(w, true);
                          }
                      } catch (Exception e) { }
                      call.resolve();
                  });
              }

              private boolean launch(Intent i) {
                  try { i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); getContext().startActivity(i); return true; } catch (Exception e) { return false; }
              }

              private boolean appDetails() {
                  return launch(new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + getContext().getPackageName())));
              }

              private void done(PluginCall call, boolean ok) { JSObject r = new JSObject(); r.put("ok", ok); call.resolve(r); }

              @PluginMethod
              public void openBattery(PluginCall call) {
                  Context c = getContext(); String pkg = c.getPackageName(); boolean ok = false;
                  if (Build.MANUFACTURER.toLowerCase().contains("xiaomi") || Build.BRAND.toLowerCase().matches(".*(redmi|poco|xiaomi).*")) {
                      Intent mi = new Intent(); mi.setComponent(new ComponentName("com.miui.powerkeeper", "com.miui.powerkeeper.ui.HiddenAppsConfigActivity"));
                      mi.putExtra("package_name", pkg); mi.putExtra("package_label", "Animes Nexora Plus"); ok = launch(mi);
                  }
                  if (!ok) {
                      try {
                          PowerManager pm = (PowerManager) c.getSystemService(Context.POWER_SERVICE);
                          if (pm != null && !pm.isIgnoringBatteryOptimizations(pkg)) ok = launch(new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + pkg)));
                      } catch (Exception e) { }
                  }
                  if (!ok) ok = launch(new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS));
                  if (!ok) ok = appDetails();
                  done(call, ok);
              }

              @PluginMethod
              public void openAutostart(PluginCall call) {
                  String[][] list = {
                      {"com.miui.securitycenter", "com.miui.permcenter.autostart.AutoStartManagementActivity"},
                      {"com.coloros.safecenter", "com.coloros.safecenter.permission.startup.StartupAppListActivity"},
                      {"com.oplus.safecenter", "com.oplus.safecenter.permission.startup.StartupAppListActivity"},
                      {"com.vivo.permissionmanager", "com.vivo.permissionmanager.activity.BgStartUpManagerActivity"},
                      {"com.huawei.systemmanager", "com.huawei.systemmanager.startupmgr.ui.StartupNormalAppListActivity"},
                      {"com.asus.mobilemanager", "com.asus.mobilemanager.MainActivity"},
                      {"com.letv.android.letvsafe", "com.letv.android.letvsafe.AutobootManageActivity"}
                  };
                  boolean ok = false;
                  for (String[] it : list) { Intent i = new Intent(); i.setComponent(new ComponentName(it[0], it[1])); if (launch(i)) { ok = true; break; } }
                  if (!ok) ok = appDetails();
                  done(call, ok);
              }

              @PluginMethod
              public void openAppSettings(PluginCall call) { done(call, appDetails()); }

              @PluginMethod
              public void isTV(PluginCall call) {
                  boolean tv = false;
                  try {
                      UiModeManager u = (UiModeManager) getContext().getSystemService(Context.UI_MODE_SERVICE);
                      tv = (u != null && u.getCurrentModeType() == Configuration.UI_MODE_TYPE_TELEVISION)
                          || getContext().getPackageManager().hasSystemFeature("android.software.leanback");
                  } catch (Exception e) { }
                  JSObject r = new JSObject();
                  r.put("tv", tv);
                  call.resolve(r);
              }
          }
