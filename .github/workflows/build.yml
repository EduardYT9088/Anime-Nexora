name: Compilar APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; mkdir out; cd out
          UA='Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36'
          g(){ code=$(curl -s -L -m 30 -A "$UA" -H 'Accept-Language: es-ES,es;q=0.9' -o "$1" -w '%{http_code}' "$2"); echo "$1 $code $(wc -c < "$1") $2" | tee -a index.txt; }
          g api.json "https://byselapuix.com/api/videos/vdkne9r0g1sg"
          cat > dec.js <<'JS'
          const j=JSON.parse(require('fs').readFileSync('api.json','utf8')).playback;
          const b=s=>Buffer.from(s.replace(/-/g,'+').replace(/_/g,'/'),'base64');
          const v=+j.version;const key=Buffer.concat([v,31-v].map(i=>b(j.key_parts[i-1])));
          (async()=>{const k=await crypto.subtle.importKey('raw',key,'AES-GCM',false,['decrypt']);const pt=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(j.iv)},k,b(j.payload))));console.log(pt.sources[0].url)})();
          JS
          M=$(node dec.js); echo "M=$M" >> index.txt
          curl -s -D m-head.txt -m 20 -A "$UA" -H "Origin: http://localhost" -o master.m3u8 "$M"; cat m-head.txt >> index.txt; head -20 master.m3u8 >> index.txt
          V=$(grep -v '^#' master.m3u8 | head -1); case "$V" in http*) ;; *) V="$(dirname "$M")/$V";; esac; echo "V=$V" >> index.txt
          curl -s -D v-head.txt -m 20 -A "$UA" -H "Origin: http://localhost" -o v.m3u8 "$V"; cat v-head.txt >> index.txt; head -12 v.m3u8 >> index.txt
          S=$(grep -v '^#' v.m3u8 | head -1); case "$S" in http*) ;; *) S="$(dirname "$V")/$S";; esac
          curl -s -D s-head.txt -m 20 -A "$UA" -H "Origin: http://localhost" -o seg.bin -r 0-1000 "$S"; cat s-head.txt >> index.txt
          python3 - <<'PY' >> index.txt
          import struct,glob
          def size(f):
              d=open(f,'rb').read()
              if d[:2]!=b'\xff\xd8': return 'no-jpg'
              i=2
              while i<len(d):
                  if d[i]!=0xFF: i+=1; continue
                  m=d[i+1]
                  if m in (0xC0,0xC1,0xC2):
                      h,w=struct.unpack('>HH',d[i+5:i+9]); return f'{w}x{h}'
                  l=struct.unpack('>H',d[i+2:i+4])[0]; i+=2+l
              return '?'
          for f in sorted(glob.glob('*.jpg')): print('SIZE',f,size(f))
          PY
          git init -q && git checkout -q -b diag-datos && git add -A && git -c user.name=diag -c user.email=diag@x commit -q -m datos
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-datos
