name: Compilar APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          UA='Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36'
          g(){ code=$(curl -s -L -A "$UA" -H 'Accept-Language: es-ES,es;q=0.9' -o "$1" -w '%{http_code} %{url_effective}' "$2"); echo "$1 -> $code $(wc -c < "$1")"; }
          g tio-home.html https://tioanime.com/
          g tio-anime.html https://tioanime.com/anime/psyren
          g tio-ep.html https://tioanime.com/ver/psyren-5
          g tio-search.html "https://tioanime.com/directorio?q=psyren"
          g tio-search2.html "https://tioanime.com/directorio?search=psyren"
          g mc-home.html https://monoschinos2.com/
          g mc-anime.html https://monoschinos.st/anime/psyren-sub-espanol
          g mc-anime2.html https://monoschinos.st/anime/psyren
          g mc-ep.html https://monoschinos.st/ver/psyren-episodio-5
          g mc-search.html "https://monoschinos.st/buscar?q=psyren"
          g flv-home.html https://www3.animeflv.net/
          g flv-home2.html https://animeflv.net/
          g jk-home.html https://jkanime.net/
          grep -o 'href="[^"]*psyren[^"]*"' mc-home.html mc-search.html | sort -u | head
      - run: |
          cd out && git init -q && git checkout -q -b diag-datos && git add -A && git -c user.name=diag -c user.email=diag@x commit -q -m datos
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-datos
