name: Compilar APK
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36'
          curl -s -A "$UA" https://animeav1.com/ > h.html; wc -c h.html
          echo "== todos los enlaces /media/slug/N (orden de aparición)"
          grep -o '/media/[a-z0-9-]*/[0-9]*' h.html | awk '!s[$0]++' | head -60
          echo "== mushoku: posiciones y contexto"
          grep -bo 'mushoku[a-z0-9-]*' h.html | head -10
          python3 - <<'PY'
          import re
          h=open('h.html',encoding='utf8').read()
          for m in re.finditer(r'mushoku[a-z0-9-]*',h):
              print('---',m.start()); print(h[max(0,m.start()-400):m.start()+250].replace('\n',' '))
          i=h.find('latestEpisodes'); print('latestEpisodes en',i)
          for k in ['<section','<h2','<h3']:
              print(k,[ (x.start(), re.sub(r'<[^>]+>','',h[x.start():x.start()+160])[:60]) for x in re.finditer(k,h)][:15])
          PY
