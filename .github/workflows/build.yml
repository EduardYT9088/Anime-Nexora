name: Compilar APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; mkdir out; cd out
          UA='Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36'
          g(){ code=$(curl -s -L -m 30 -A "$UA" -H 'Accept-Language: es-ES,es;q=0.9' -o "$1" -w '%{http_code}' "$2"); echo "$1 $code $(wc -c < "$1") $2" | tee -a index.txt; }
          g tio-op.html "https://tioanime.com/ver/one-piece-tv-1"
          g tio-sl.html "https://tioanime.com/ver/ore-dake-level-up-na-ken-1"
          g flv-sl.html "https://www3.animeflv.net/ver/ore-dake-level-up-na-ken-1"
          g flv-search.html "https://www3.animeflv.net/browse?q=solo%20leveling"
          g tio-search.html "https://tioanime.com/directorio?q=ore%20dake"
          g mc-search.html "https://monoschinos.st/buscar?q=ore%20dake"
          cat tio-*.html flv-sl.html | grep -oE 'https?:\\?/\\?/[^"]*(streamtape|ok\.ru|mixdrop|stape|okru|yourupload|mega|sw|wish|voe)[^"]*' | sed 's#\\/#/#g' | sort -u > emb.txt
          cat emb.txt
          n=0; while read u; do n=$((n+1)); g "emb-$n.html" "$u"; done < emb.txt
          python3 - <<'PY' >> index.txt
          import struct,glob
          def size(f):
              d=open(f,'rb').read()
              if d[:2]!=b'\xff\xd8': return 'no-jpg'
              i=2
              while i<len(d):
                  if d[i]!=0xFF: i+=1; continue
                  m=d[i+1]
                  if m in (0xC0,0xC1,0xC2):
                      h,w=struct.unpack('>HH',d[i+5:i+9]); return f'{w}x{h}'
                  l=struct.unpack('>H',d[i+2:i+4])[0]; i+=2+l
              return '?'
          for f in sorted(glob.glob('*.jpg')): print('SIZE',f,size(f))
          PY
          git init -q && git checkout -q -b diag-datos && git add -A && git -c user.name=diag -c user.email=diag@x commit -q -m datos
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-datos
