name: Compilar APK
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== jikan"; curl -s "https://api.jikan.moe/v4/anime?q=Kanata%20kara&limit=3" | grep -o '"mal_id":[0-9]*\|"title":"[^"]*"' | head -6 | tr '\n' ' '; echo
          for q in "52991/1?types[]=op&types[]=ed&episodeLength=0" "52991/5?types[]=op&types[]=ed&types[]=mixed-ed&types[]=mixed-op&episodeLength=1420" "21/1100?types[]=op&types[]=ed&episodeLength=0"; do
            echo "== aniskip $q"; curl -s -w " HTTP %{http_code}" "https://api.aniskip.com/v2/skip-times/$q" | head -c 700; echo; done
          echo "== cors"; curl -s -o /dev/null -D - "https://api.aniskip.com/v2/skip-times/52991/1?types[]=ed&episodeLength=0" -H "Origin: http://localhost" | grep -i "access-control\|HTTP/"
