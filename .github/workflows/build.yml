name: Limpieza
on: workflow_dispatch
permissions:
  contents: write
jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - name: Borrar rama y prueba de monedas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R: ${{ github.repository }}
        run: |
          gh release delete v1.0.4-monedas-prueba -R "$R" --yes --cleanup-tag || true
          gh api -X DELETE "repos/$R/git/refs/heads/prueba-monedas" || true
          gh api "repos/$R/branches" --jq '.[].name'
          gh api "repos/$R/releases" --jq '.[].tag_name'
