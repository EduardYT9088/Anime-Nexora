# Animes Nexora Plus — compila el APK automáticamente a partir de index.html
# Ruta en el repo: .github/workflows/build.yml
name: Compilar APK

on:
  push:
    branches: [main, master]
    paths: ['index.html', '.github/workflows/build.yml']
  workflow_dispatch:
  schedule:
    - cron: '*/14 * * * *'   # despierta tu servidor cada 14 min (no compila el APK)

permissions:
  contents: write

env:
  APP_NAME: "Animes Nexora Plus"
  APP_VERSION: "1.0.3"   # <- cambia aquí la versión del APK
  # Comentarios (Supabase): pega aquí la "Project URL" y la clave pública ("anon" o "publishable")
  NX_SB_URL: "https://lvnuolgcqttvlkvgagde.supabase.co"
  NX_SB_KEY: "sb_publishable_vvj-N9C2rbS-_rXPtxOHtg_iRBDuPaq"
  APP_ID: "com.nexora.animesplus"
  # Pega aquí la dirección de tu servidor en Render (déjalo vacío si no usas servidor)
  SERVER_URL: ""

jobs:
  despertar:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Mantener el servidor despierto
        run: |
          if [ -z "$SERVER_URL" ]; then echo "Sin SERVER_URL, nada que hacer"; exit 0; fi
          curl -s -o /dev/null -w "Servidor respondió %{http_code}\n" --max-time 90 "${SERVER_URL%/}/health" || true

  apk:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Probar servidor de comentarios
        if: env.NX_SB_URL != ''
        continue-on-error: true
        run: |
          code=$(curl -s -o sb.json -w "%{http_code}" "${NX_SB_URL}/rest/v1/comments?select=id&limit=1" -H "apikey: ${NX_SB_KEY}")
          echo "Comentarios: HTTP $code"; head -c 400 sb.json; echo
          [ "$code" = "200" ] && echo "OK: la tabla de comentarios responde" || echo "::warning::El servidor de comentarios respondió $code (¿corriste el SQL?)"
      - name: Crear proyecto Capacitor
        run: |
          mkdir -p _build/www
          cp index.html _build/www/index.html
          # la versión de la app sale de APP_VERSION (se usa para avisar actualizaciones)
          sed -i "s/__APP_VERSION__/${APP_VERSION}/g" _build/www/index.html
          sed -i "s|__SB_URL__|${NX_SB_URL}|g; s|__SB_KEY__|${NX_SB_KEY}|g" _build/www/index.html
          cd _build
          npm init -y > /dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 \
                @capacitor/app@6 @capacitor/screen-orientation@6 @capacitor/status-bar@6 \
                @capacitor/local-notifications@6 \
                @capacitor/filesystem@6 @capawesome-team/capacitor-file-opener@6 \
                hls.js@1.5.17 qrcode@1.5.4
          cp node_modules/hls.js/dist/hls.min.js www/hls.min.js
          # Código QR de donación (PayPal) dentro de Ajustes
          cat > qr.js <<'EOF'
          const Q=require('qrcode'),fs=require('fs');
          Q.toString('https://www.paypal.me/EdwardAlvarado285',{type:'svg',margin:1,errorCorrectionLevel:'M',color:{dark:'#0b0a1a',light:'#ffffff'}}).then(svg=>{
            const f='www/index.html';const h=fs.readFileSync(f,'utf8');
            if(!h.includes('<!--NX_QR-->'))throw new Error('falta el marcador del QR');
            fs.writeFileSync(f,h.replace('<!--NX_QR-->',svg.replace(/<\?xml[^>]*>/,'').trim()));console.log('QR de donación listo');
          }).catch(e=>{console.error(e);process.exit(1)});
          EOF
          node qr.js
          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "www",
            "backgroundColor": "#070611",
            "server": { "androidScheme": "http", "cleartext": true },
            "android": { "allowMixedContent": true },
            "plugins": {
              "CapacitorHttp": { "enabled": false },
              "LocalNotifications": { "smallIcon": "ic_stat_nexora", "iconColor": "#8B6BFF" }
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Personalizar Android (icono, splash, permisos, versión)
        run: |
          cd _build/android/app/src/main
          RES=res
          # Pantalla completa: usa la zona de la cámara perforada y oculta las barras al ver un episodio
          JDIR=java/$(echo "$APP_ID" | tr . /)
          mkdir -p $JDIR
          cat > $JDIR/MainActivity.java <<EOF
          package ${APP_ID};

          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(NexoraScreen.class);
                  super.onCreate(savedInstanceState);
                  NexoraCheck.schedule(this);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }
              }
          }
          EOF
          cat > $JDIR/NexoraScreen.java <<EOF
          package ${APP_ID};

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.UiModeManager;
          import android.content.ComponentName;
          import android.content.SharedPreferences;
          import androidx.core.app.NotificationManagerCompat;
