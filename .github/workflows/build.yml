name: Compilar APK
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA='Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36'
          B=https://ww4.animeonline.ninja
          echo "== GET admin-ajax"; curl -s -m 20 -A "$UA" -w ' HTTP %{http_code}' "$B/wp-admin/admin-ajax.php?action=doo_player_ajax&post=99996&nume=1&type=tv" | head -c 300; echo
          echo "== POST sin X-Requested-With"; curl -s -m 20 -A "$UA" -X POST --data "action=doo_player_ajax&post=99996&nume=1&type=tv" -w ' HTTP %{http_code}' "$B/wp-admin/admin-ajax.php" | head -c 300; echo
          echo "== POST content-type con charset"; curl -s -m 20 -A "$UA" -X POST -H 'Content-Type: application/x-www-form-urlencoded; charset=UTF-8' --data "action=doo_player_ajax&post=99996&nume=1&type=tv" -w ' HTTP %{http_code}' "$B/wp-admin/admin-ajax.php" | head -c 300; echo
          echo "== POST JSON (por si el telefono manda JSON)"; curl -s -m 20 -A "$UA" -X POST -H 'Content-Type: application/json' --data '{"action":"doo_player_ajax","post":"99996","nume":"1","type":"tv"}' -w ' HTTP %{http_code}' "$B/wp-admin/admin-ajax.php" | head -c 300; echo
          echo "== busqueda con espacio %20"; curl -s -L -m 20 -A "$UA" -o s.html -w '%{http_code} %{url_effective} %{size_download}\n' "$B/?s=One%20Piece"; grep -c 'result-item' s.html
          echo "== busqueda ww3"; curl -s -L -m 20 -A "$UA" -o s3.html -w '%{http_code} %{url_effective} %{size_download}\n' "https://ww3.animeonline.ninja/?s=One%20Piece"
          echo "== cabeceras pagina"; curl -s -I -m 20 -A "$UA" "$B/online/one-piece-070125/" | grep -i "HTTP/\|content-type\|cf-\|server\|content-encoding"
          echo "== tiempo pagina grande"; curl -s -m 60 -A "$UA" -o op.html -w '%{http_code} %{size_download} %{time_total}s\n' --compressed "$B/online/one-piece-070125/"
