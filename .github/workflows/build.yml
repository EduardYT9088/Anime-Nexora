# Animes Nexora Plus — compila el APK automáticamente a partir de index.html
# Ruta en el repo: .github/workflows/build.yml
name: Compilar APK

on:
  push:
    branches: [main, master]
    paths: ['index.html', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: "Animes Nexora Plus"
  APP_ID: "com.nexora.animesplus"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Crear proyecto Capacitor
        run: |
          mkdir -p _build/www
          cp index.html _build/www/index.html
          cd _build
          npm init -y > /dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 \
                @capacitor/app@6 @capacitor/screen-orientation@6 @capacitor/status-bar@6 \
                hls.js@1.5.17
          cp node_modules/hls.js/dist/hls.min.js www/hls.min.js
          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "www",
            "backgroundColor": "#070611",
            "server": { "androidScheme": "http", "cleartext": true },
            "android": { "allowMixedContent": true },
            "plugins": { "CapacitorHttp": { "enabled": false } }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Personalizar Android (icono, splash, permisos, versión)
        run: |
          cd _build/android/app/src/main
          RES=res
          # Permitir APIs http:// y pantalla completa de video
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' AndroidManifest.xml

          # Colores propios
          cat > $RES/values/nx_colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="nx_bg">#070611</color>
            <color name="nx_a">#7C5CFF</color>
            <color name="nx_b">#22D3EE</color>
          </resources>
          EOF

          # Icono adaptativo Nexora (vector)
          rm -f $RES/drawable*/ic_launcher_foreground.xml $RES/drawable*/ic_launcher_background.xml
          cat > $RES/drawable/nx_icon_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:pathData="M30,30h48v48h-48z">
              <aapt:attr name="android:fillColor">
                <gradient android:type="linear" android:startX="30" android:startY="30"
                    android:endX="78" android:endY="78"
                    android:startColor="#7C5CFF" android:centerColor="#4F8CFF" android:endColor="#22D3EE"/>
              </aapt:attr>
            </path>
            <path android:pathData="M43,65V43l22,22V43"
                android:strokeColor="#FFFFFF" android:strokeWidth="6"
                android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000"/>
          </vector>
          EOF
          cat > $RES/drawable/nx_icon_bg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:pathData="M0,0h108v108h-108z">
              <aapt:attr name="android:fillColor">
                <gradient android:type="linear" android:startX="0" android:startY="0"
                    android:endX="108" android:endY="108"
                    android:startColor="#7C5CFF" android:centerColor="#4F8CFF" android:endColor="#22D3EE"/>
              </aapt:attr>
            </path>
          </vector>
          EOF
          mkdir -p $RES/mipmap-anydpi-v26
          for n in ic_launcher ic_launcher_round; do
          cat > $RES/mipmap-anydpi-v26/$n.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/nx_icon_bg"/>
            <foreground android:drawable="@drawable/nx_icon_fg"/>
            <monochrome android:drawable="@drawable/nx_icon_fg"/>
          </adaptive-icon>
          EOF
          done

          # Splash propio: fondo oscuro + logo
          find $RES -name 'splash.png' -delete
          cat > $RES/drawable/splash.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:drawable="@color/nx_bg"/>
            <item android:width="160dp" android:height="160dp" android:gravity="center" android:drawable="@drawable/nx_icon_fg"/>
          </layer-list>
          EOF

          # Versión automática según número de compilación (Android 7+)
          cd ../../
          sed -i 's/minSdkVersion = 22/minSdkVersion = 24/' ../variables.gradle
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" build.gradle

      - name: Compilar APK
        run: |
          cd _build/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../../out
          cp app/build/outputs/apk/debug/app-debug.apk "../../out/AnimesNexoraPlus-v1.${{ github.run_number }}.apk"

      - name: Subir APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: AnimesNexoraPlus-APK
          path: out/*.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Animes Nexora Plus v1.${{ github.run_number }}
          body: |
            APK compilado automáticamente.
            Descarga el archivo .apk de abajo e instálalo en tu Android.
            Licencia: Nexora Eduard Gamer
          files: out/*.apk
