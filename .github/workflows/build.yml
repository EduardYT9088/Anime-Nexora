name: Compilar APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; mkdir out; cd out
          UA='Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36'
          g(){ code=$(curl -s -L -m 30 -A "$UA" -H 'Accept-Language: es-ES,es;q=0.9' -o "$1" -w '%{http_code}' "$2"); echo "$1 $code $(wc -c < "$1") $2" | tee -a index.txt; }
          g nj-curl.html "https://ww3.animeonline.ninja/?s=isekai"
          npm i -s playwright@1.47.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > nj.js <<'EOF'
          const {chromium}=require('playwright');const fs=require('fs');
          (async()=>{const b=await chromium.launch({headless:true,args:['--disable-blink-features=AutomationControlled']});
            const c=await b.newContext({userAgent:'Mozilla/5.0 (Linux; Android 13; SM-S911B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36',locale:'es-ES',viewport:{width:412,height:900}});
            const p=await c.newPage();
            const qs=['isekai','cheat skill','Isekai de Cheat Skill','level up','tensei','reincarnated','mushoku','shield hero','tate no yuusha','slime'];
            for(const q of qs){try{await p.goto('https://ww3.animeonline.ninja/?s='+encodeURIComponent(q),{waitUntil:'domcontentloaded',timeout:45000});
              for(let i=0;i<20;i++){const t=await p.title();if(!/moment|momento|checking/i.test(t))break;await p.waitForTimeout(1500)}
              const r=await p.evaluate(()=>[document.title,[...document.querySelectorAll('.result-item')].map(x=>{const a=x.querySelector('.title a');const y=x.querySelector('.year');return (a?a.textContent.trim()+' | '+a.getAttribute('href'):'')+(y?' | '+y.textContent.trim():'')})]);
              fs.appendFileSync('nj.txt','### '+q+' :: '+r[0]+'\n'+r[1].join('\n')+'\n')}catch(e){fs.appendFileSync('nj.txt','### '+q+' ERR '+e.message+'\n')}}
            await b.close()})();
          EOF
          node nj.js; echo "nj $(wc -l < nj.txt 2>/dev/null)" | tee -a index.txt; rm -rf node_modules package*.json
          git init -q && git checkout -q -b diag-datos && git add -A && git -c user.name=diag -c user.email=diag@x commit -q -m datos
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-datos
