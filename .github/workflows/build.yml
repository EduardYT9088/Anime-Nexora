# Animes Nexora Plus — compila el APK automáticamente a partir de index.html
# Ruta en el repo: .github/workflows/build.yml
name: Compilar APK

on:
  push:
    branches: [main, master]
    paths: ['index.html', '.github/workflows/build.yml']
  workflow_dispatch:
  schedule:
    - cron: '*/14 * * * *'   # despierta tu servidor cada 14 min (no compila el APK)

permissions:
  contents: write

env:
  APP_NAME: "Animes Nexora Plus"
  APP_VERSION: "1.0.5"   # <- cambia aquí la versión del APK
  APP_ID: "com.nexora.animesplus"
  # Pega aquí la dirección de tu servidor en Render (déjalo vacío si no usas servidor)
  SERVER_URL: ""

jobs:
  despertar:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Mantener el servidor despierto
        run: |
          if [ -z "$SERVER_URL" ]; then echo "Sin SERVER_URL, nada que hacer"; exit 0; fi
          curl -s -o /dev/null -w "Servidor respondió %{http_code}\n" --max-time 90 "${SERVER_URL%/}/health" || true

  apk:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Crear proyecto Capacitor
        run: |
          mkdir -p _build/www
          cp index.html _build/www/index.html
          cd _build
          npm init -y > /dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 \
                @capacitor/app@6 @capacitor/screen-orientation@6 @capacitor/status-bar@6 \
                hls.js@1.5.17
          cp node_modules/hls.js/dist/hls.min.js www/hls.min.js
          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "www",
            "backgroundColor": "#070611",
            "server": { "androidScheme": "http", "cleartext": true },
            "android": { "allowMixedContent": true },
            "plugins": { "CapacitorHttp": { "enabled": false } }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Personalizar Android (icono, splash, permisos, versión)
        run: |
          cd _build/android/app/src/main
          RES=res
          # Permitir APIs http:// y pantalla completa de video
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' AndroidManifest.xml

          # Colores propios
          cat > $RES/values/nx_colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="nx_bg">#070611</color>
            <color name="nx_a">#7C5CFF</color>
            <color name="nx_b">#22D3EE</color>
          </resources>
          EOF

          # Logo oficial Nexora: icono adaptativo (fondo degradado + "N" con órbita)
          rm -f $RES/drawable*/ic_launcher_foreground.xml $RES/drawable*/ic_launcher_background.xml
          cat > $RES/drawable/nx_icon_bg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:pathData="M0,0h108v108h-108z">
              <aapt:attr name="android:fillColor">
                <gradient android:type="linear" android:startX="0" android:startY="0" android:endX="108" android:endY="108"
                    android:startColor="#7C5CFF" android:centerColor="#4F8CFF" android:endColor="#22D3EE"/>
              </aapt:attr>
            </path>
            <path android:pathData="M0,0h108v108h-108z">
              <aapt:attr name="android:fillColor">
                <gradient android:type="radial" android:centerX="32" android:centerY="27" android:gradientRadius="70"
                    android:startColor="#47FFFFFF" android:endColor="#00FFFFFF"/>
              </aapt:attr>
            </path>
          </vector>
          EOF
          cat > $RES/drawable/nx_icon_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <group android:scaleX="0.86" android:scaleY="0.86" android:pivotX="54" android:pivotY="54">
              <group android:rotation="-24" android:pivotX="54" android:pivotY="54">
                <path android:pathData="M20,54a34,13 0,1 0,68 0a34,13 0,1 0,-68 0"
                    android:strokeColor="#61FFFFFF" android:strokeWidth="3" android:fillColor="#00000000"/>
              </group>
              <path android:pathData="M38,71V37l32,34V37"
                  android:strokeColor="#FFFFFF" android:strokeWidth="9"
                  android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000"/>
              <path android:pathData="M77,27l6,3.4l-6,3.4z" android:fillColor="#FFFFFF"/>
              <path android:pathData="M23,78a3,3 0,1 0,6 0a3,3 0,1 0,-6 0" android:fillColor="#D9FFFFFF"/>
            </group>
          </vector>
          EOF
          cat > $RES/drawable/nx_icon_mono.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <group android:scaleX="0.86" android:scaleY="0.86" android:pivotX="54" android:pivotY="54">
              <path android:pathData="M38,71V37l32,34V37"
                  android:strokeColor="#FFFFFFFF" android:strokeWidth="9"
                  android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000"/>
            </group>
          </vector>
          EOF
          # Logo completo (cuadro redondeado) para la pantalla de carga
          cat > $RES/drawable/nx_logo.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:pathData="M30,0h48a30,30 0,0 1,30 30v48a30,30 0,0 1,-30 30h-48a30,30 0,0 1,-30 -30v-48a30,30 0,0 1,30 -30z">
              <aapt:attr name="android:fillColor">
                <gradient android:type="linear" android:startX="0" android:startY="0" android:endX="108" android:endY="108"
                    android:startColor="#7C5CFF" android:centerColor="#4F8CFF" android:endColor="#22D3EE"/>
              </aapt:attr>
            </path>
            <group android:rotation="-24" android:pivotX="54" android:pivotY="54">
              <path android:pathData="M20,54a34,13 0,1 0,68 0a34,13 0,1 0,-68 0"
                  android:strokeColor="#61FFFFFF" android:strokeWidth="3" android:fillColor="#00000000"/>
            </group>
            <path android:pathData="M38,71V37l32,34V37" android:strokeColor="#FFFFFF" android:strokeWidth="9"
                android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="#00000000"/>
            <path android:pathData="M77,27l6,3.4l-6,3.4z" android:fillColor="#FFFFFF"/>
            <path android:pathData="M23,78a3,3 0,1 0,6 0a3,3 0,1 0,-6 0" android:fillColor="#D9FFFFFF"/>
          </vector>
          EOF
          mkdir -p $RES/mipmap-anydpi-v26
          for n in ic_launcher ic_launcher_round; do
          cat > $RES/mipmap-anydpi-v26/$n.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/nx_icon_bg"/>
            <foreground android:drawable="@drawable/nx_icon_fg"/>
            <monochrome android:drawable="@drawable/nx_icon_mono"/>
          </adaptive-icon>
          EOF
          done

          # Pantalla de carga: fondo oscuro + logo oficial
          find $RES -name 'splash.png' -delete
          cat > $RES/drawable/splash.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:drawable="@color/nx_bg"/>
            <item android:width="128dp" android:height="128dp" android:gravity="center" android:drawable="@drawable/nx_logo"/>
          </layer-list>
          EOF
          # Versión automática (Android 8+ para que el icono oficial se vea en todos los equipos)
          cd ../../
          sed -i 's/minSdkVersion = 2[0-9]/minSdkVersion = 26/' ../variables.gradle
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${APP_VERSION}\"/" build.gradle

      - name: Compilar APK
        run: |
          cd _build/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../../out
          cp app/build/outputs/apk/debug/app-debug.apk "../../out/AnimesNexoraPlus-v${APP_VERSION}.apk"

      - name: Subir APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: AnimesNexoraPlus-APK
          path: out/*.apk

      - name: Reemplazar release anterior de la misma versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v${APP_VERSION}" --cleanup-tag -y --repo "${{ github.repository }}" || true

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Animes Nexora Plus v${{ env.APP_VERSION }}
          make_latest: true
          body: |
            APK compilado automáticamente.
            Descarga el archivo .apk de abajo e instálalo en tu Android.
            Licencia: Nexora Eduard Gamer
          files: out/*.apk
