name: Compilar APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; mkdir out; cd out
          UA='Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36'
          g(){ code=$(curl -s -L -m 30 -A "$UA" -H 'Accept-Language: es-ES,es;q=0.9' -o "$1" -w '%{http_code}' "$2"); echo "$1 $code $(wc -c < "$1") $2" | tee -a index.txt; }
          g av-s1.html "https://animeav1.com/catalogo?search=sword%20art%20online"
          g av-s2.html "https://animeav1.com/catalogo?search=sword"
          g av-s3.html "https://animeav1.com/catalogo?q=sword%20art%20online"
          g av-s4.html "https://animeav1.com/catalogo?search=sword%20art"
          g tio-s.html "https://tioanime.com/directorio?q=sword%20art%20online"
          g mc-s.html "https://monoschinos.st/buscar?q=sword%20art%20online"
          curl -s -m 20 -X POST -H 'Content-Type: application/json' --data '{"query":"query($s:String){Page(perPage:6){media(search:$s,type:ANIME){title{romaji english}synonyms}}}","variables":{"s":"World Star Online"}}' https://graphql.anilist.co > anilist.json; echo "anilist $(wc -c < anilist.json)" | tee -a index.txt
          git init -q && git checkout -q -b diag-datos && git add -A && git -c user.name=diag -c user.email=diag@x commit -q -m datos
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-datos
